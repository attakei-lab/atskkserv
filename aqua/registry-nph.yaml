packages:
  - type: github_release
    repo_owner: arnetheduck
    repo_name: nph
    description: An opinionated code formatter for Nim
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "prerelease"
        asset: nph-{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          darwin: macosx
      - version_constraint: semver("<= 0.6.0")
        asset: nph-{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
          darwin: macosx
      - version_constraint: "true"
        asset: nph-{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          darwin: macosx
