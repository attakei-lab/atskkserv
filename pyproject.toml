[project]
name = "atskkserv"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
]
docs = [
    "atsphinx-footnotes>=0.3.2",
    "docutils>=0.22",
    "piccolo-theme>=0.24.0",
    "sphinx>=9",
    "sphinx-autobuild>=2025.8.25",
]
lint = [
    "pyrefly>=1.3.1",
    "rst2txtast>=0.2.0.post1786625040",
    "rstcheck[sphinx]>=6.3.0",
    "ruff>=0.16.7",
]
test = [
    "pytest>=9.1.1",
    "random-port>=0.0.9",
]

[tool.uv.sources]
rst2txtast = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.pyrefly]
search-path = ["tests"]

[tool.rstcheck]
log_level = "DEBUG"
ignore_directives = ["todo"]
